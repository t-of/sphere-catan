<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c10">
  <meta name="description" content="サッカーボール形の盤の上で遊ぶ、3 人交代のカタン風ゲームの試作。">
  <title>sphere-catan — sphere-catan</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="sphere-catan">
  <meta property="og:title" content="sphere-catan — sphere-catan">
  <meta property="og:description" content="">
  <meta property="og:url" content="https://t-of.github.io/sphere-catan/">
  <meta property="og:image" content="https://t-of.github.io/sphere-catan/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="sphere-catan">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1 class="bar__title">sphere-catan</h1>
      <div class="bar__actions">
        <button class="pill" data-wak="install" hidden>アプリにする</button>
        <button class="pill" data-wak="share">共有</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="msg" id="msg" hidden></div>
    </section>

    <section class="panel" id="panel">
      <div class="who" id="who"></div>
      <div class="hand" id="hand"></div>
      <div class="btns" id="btns"></div>
      <div class="trade" id="trade" hidden>
        <label class="trade__col">出す<select id="give"></select></label>
        <span class="trade__arrow">→</span>
        <label class="trade__col">もらう<select id="get"></select></label>
        <button class="pill go" id="tbtn">交換</button>
      </div>
    </section>

    <footer class="credit">
      <a href="/">T.OF...</a> のアプリ・<a href="https://t-of.github.io/contact/">問い合わせ</a>
    </footer>
  </main>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
